# Docker Compose for Health Telegram Bot

version: '3.8'

services:
  health-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: health-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist data
      - bot_data:/app/data
      # Logs
      - bot_logs:/app/logs
      # Backup volume
      - bot_backups:/app/backups
    networks:
      - health-network
    # Optional: Port for webhooks
    # ports:
    #   - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Optional: PostgreSQL database (alternative to SQLite)
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: health-bot-db
  #   restart: unless-stopped
